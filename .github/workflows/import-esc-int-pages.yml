name: Import ESC INT page snapshot

on:
  push:
    branches: [m2/import-esc-int-content]
    paths:
      - .github/workflows/import-esc-int-pages.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2/import-esc-int-content
      - name: Snapshot published esc-int pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf imports/esc-int-pages
          mkdir -p imports/esc-int-pages docs/operations
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlparse
          import xml.etree.ElementTree as ET
          import hashlib, json

          base = 'https://orp-esc-int.netlify.app'
          def fetch(url):
              req = Request(url, headers={'User-Agent':'ESC-digital migration snapshot/1.0'})
              with urlopen(req, timeout=30) as r:
                  return r.read()

          sitemap = fetch(base + '/sitemap.xml')
          root = ET.fromstring(sitemap)
          urls = []
          for node in root.iter():
              if node.tag.endswith('loc') and node.text:
                  u = node.text.strip().replace('http://localhost:1313/esc-int', base)
                  parsed = urlparse(u)
                  if parsed.netloc and parsed.netloc != urlparse(base).netloc:
                      continue
                  path = parsed.path
                  if path.startswith('/esc-int/'):
                      path = path[len('/esc-int'):]
                  if path in ('','/') or path.rstrip('/') in ('/sponsoren','/aktuelles/testbeitrag'):
                      continue
                  urls.append(base + path)

          manifest = []
          for url in sorted(set(urls)):
              path = urlparse(url).path.strip('/')
              data = fetch(url)
              out = Path('imports/esc-int-pages') / path / 'index.html'
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(data)
              manifest.append({'path':'/' + path + '/', 'source':url, 'sha256':hashlib.sha256(data).hexdigest()})

          Path('docs/operations/esc-int-pages-manifest.json').write_text(
              json.dumps({'source':base,'pages':manifest}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Imported {len(manifest)} published esc-int pages')
          PY
      - name: Commit frozen page snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imports/esc-int-pages docs/operations/esc-int-pages-manifest.json
          git commit -m 'content: import frozen esc-int page snapshot'
          git push origin HEAD:m2/import-esc-int-content
