name: Publish ESC preview artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esc-preview-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          sudo apt-get update
          sudo apt-get install -y hugo
          hugo version

      - name: Validate canonical inputs
        run: |
          python3 scripts/validate_esc_content_migration_intake.py
          python3 scripts/validate_esc_initial_content_seed.py
          python3 scripts/sync_founder_team_rosters.py
          python3 site/scripts/test_news_retention.py
          python3 site/scripts/validate_river_rats_editor.py
          node site/scripts/test_hero_rotation.js
          sha256sum -c docs/operations/vereinsfuehrung-portraits.sha256

      - name: Build canonical preview host
        env:
          HUGO_BASEURL: https://preview.esc-geretsried.de/
          HOCKEYDATA_API_KEY: ${{ secrets.HOCKEYDATA_API_KEY }}
        run: bash site/scripts/build.sh

      - name: Validate preview artifact
        run: |
          bash site/scripts/validate.sh
          python3 site/scripts/golive_static_gate.py site/public
          python3 scripts/validate_esc_git_only_completion.py

      - name: Publish immutable static artifact to preview-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd site/public
          touch .nojekyll
          printf 'source_commit=%s\nbuilt_at=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .orp-preview-build
          git init
          git checkout -b preview-dist
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "preview: publish ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin preview-dist
