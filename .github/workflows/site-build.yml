name: Site build validation

on:
  pull_request:
    paths:
      - 'site/**'
      - 'content/**'
      - 'docs/content-migration/**'
      - 'config/editor-runtime.json'
      - 'config/news-retention.json'
      - 'scripts/sync_founder_team_rosters.py'
      - 'scripts/validate_esc_git_only_completion.py'
      - 'scripts/validate_esc_content_migration_intake.py'
      - 'scripts/validate_esc_initial_content_seed.py'
      - '.github/workflows/site-build.yml'
      - '.github/workflows/preview-publish.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate migration intake and initial seed
        run: |
          python3 scripts/validate_esc_content_migration_intake.py
          python3 scripts/validate_esc_initial_content_seed.py
          python3 scripts/sync_founder_team_rosters.py
          python3 site/scripts/test_news_retention.py

      - name: Install Hugo
        run: |
          sudo apt-get update
          sudo apt-get install -y hugo
          hugo version

      - name: Validate River Rats editor state and homepage youth rotation
        run: |
          python3 site/scripts/validate_river_rats_editor.py
          node site/scripts/test_hero_rotation.js

      - name: Build canonical root variant
        run: bash site/scripts/build.sh

      - name: Validate canonical root variant
        run: |
          bash site/scripts/validate.sh
          python3 site/scripts/golive_static_gate.py site/public
          python3 scripts/validate_esc_git_only_completion.py

      - name: Build GitHub Pages variant
        env:
          HUGO_BASEURL: https://esc-geretsried.github.io/esc-digital/
        run: bash site/scripts/build.sh

      - name: Validate GitHub Pages routing
        run: |
          bash site/scripts/validate.sh
          python3 site/scripts/golive_static_gate.py site/public --base-path /esc-digital/
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.brand = None
                  self.current = None
                  self.start = None
              def handle_starttag(self, tag, attrs):
                  if tag != 'a':
                      return
                  attrs = dict(attrs)
                  self.current = {'href': attrs.get('href'), 'aria': attrs.get('aria-label'), 'text': ''}
                  if attrs.get('aria-label') == 'ESC River Rats Geretsried – Startseite':
                      self.brand = attrs.get('href')
              def handle_data(self, data):
                  if self.current is not None:
                      self.current['text'] += data
              def handle_endtag(self, tag):
                  if tag == 'a' and self.current is not None:
                      if ' '.join(self.current['text'].split()) == 'Start':
                          self.start = self.current['href']
                      self.current = None

          parser = Links()
          parser.feed(Path('site/public/index.html').read_text(encoding='utf-8'))
          expected = '/esc-digital/'
          if parser.brand != expected:
              raise SystemExit(f'ERROR: logo homepage link is {parser.brand!r}, expected {expected!r}')
          if parser.start != expected:
              raise SystemExit(f'ERROR: Start homepage link is {parser.start!r}, expected {expected!r}')
          print('GitHub Pages homepage routing validated:', expected)
          PY

      - name: Upload validated preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: esc-site-preview
          path: site/public/
          if-no-files-found: error
          retention-days: 7
