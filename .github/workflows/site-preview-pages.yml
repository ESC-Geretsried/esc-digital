name: ESC Digital Pages Preview

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'content/**'
      - '.github/workflows/site-preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: esc-digital-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_BASEURL: https://esc-geretsried.github.io/esc-digital/
      HOCKEYDATA_API_KEY: ${{ secrets.HOCKEYDATA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          sudo apt-get update
          sudo apt-get install -y hugo
          hugo version

      - name: Build
        run: bash site/scripts/build.sh

      - name: Validate
        run: bash site/scripts/validate.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
