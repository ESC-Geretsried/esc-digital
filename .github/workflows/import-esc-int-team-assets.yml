name: Import verified ESC INT team assets

on:
  push:
    branches: [m2/import-esc-int-content]
    paths:
      - .github/workflows/import-esc-int-team-assets.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2/import-esc-int-content
      - name: Download and verify esc-int team assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/teams
          base='https://orp-esc-int.netlify.app/images/teams'
          while read -r name sha; do
            curl --fail --location --silent --show-error "$base/$name" -o "images/teams/$name"
            actual="$(git hash-object "images/teams/$name")"
            test "$actual" = "$sha" || { echo "Blob mismatch for $name: $actual != $sha" >&2; exit 1; }
          done <<'EOF'
          damen-team.jpg f1b13f476f7f2ad0dd23c06201e985383796c178
          eiskunstlauf.jpeg 9d54163def8a128c07830c5f16b78e23907fd8b1
          eislaufschule-2025-2026.png 2e030b7ce56764fea7b59f9b5d3d9ff15ad6c9a4
          inklusion.jpg b98765816afb7ca10b993021f072d2e4adc1057a
          u13-team.jpg 6c2a945d19dba9958d6bf75933b56da0919863c2
          u15-team.jpg 35ffdeb62dd10baea2dec36fc6046e80ac8b9fbc
          u17-team.jpg 345e80ecd0ae2b671a81551be464d071debf9161
          u20-team.jpg 0e7585a7fdf5905a0119fdbbf37c72251cda838a
          u7-team.jpg 8c2eb22054e4bd7b16d4ebbfc0c2ee6deffbbc4f
          u9-team.jpg 6f8e950cb0128e94844b0fa8adcfbddc726bcba7
          EOF
          sha256sum images/teams/* > docs/operations/esc-int-team-assets.sha256
      - name: Commit canonical tenant copies
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/teams docs/operations/esc-int-team-assets.sha256
          git commit -m 'assets: import verified esc-int team images'
          git push origin HEAD:m2/import-esc-int-content
