<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ site.Title }}</title>
  <meta name="description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <meta name="robots" content="noindex,nofollow,noarchive">
  {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
</head>
<body>
  <div class="flashbar" aria-label="Hinweis">
    <div class="shell flashbar__inner">
      <span class="flashbar__label">Dauerkarte</span>
      <span class="flashbar__text">Dauerkarten Saison 2026/2027 – jetzt hier verbindlich</span>
    </div>
  </div>
  <header class="site-header">
    <div class="shell header-row">
      <a class="brand" href="{{ "/" | relURL }}" aria-label="ESC River Rats Geretsried">
        <img src="{{ "images/river-rats-logo.png" | relURL }}" alt="River Rats">
      </a>
      <button class="menu-button" type="button" aria-label="Menü öffnen">MENÜ <span>≡</span></button>
    </div>
  </header>
  <main id="main-content">{{ block "main" . }}{{ end }}</main>
  <footer class="site-footer"><div class="shell">Eishockey. Gemeinschaft. Geretsried.</div></footer>
</body>
</html>
